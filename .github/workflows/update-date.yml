name: Update Last Updated Date

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update last updated date
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          sed -i "s/\*Last updated: [0-9-]*\*/\*Last updated: $TODAY\*/" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update last updated date"
          git push
